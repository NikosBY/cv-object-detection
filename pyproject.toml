[project]
name = "cv-object-detection"
version = "0.1.0"
description = "Road object detection with YOLOv8: training, optimization, deployment"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "onnx",
    "onnxruntime",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvobjectdetection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
